# Taskpenny model catalog.
#
# Prices are USD per million tokens, as listed by Vercel AI Gateway
# (GET https://ai-gateway.vercel.sh/v1/models) on 2026-09-25.
# Run `taskpenny models --check` to compare them with the live catalog.
#
# How the router uses this file: for every task, Jev decides the tier (1 to 4)
# and the task type. Taskpenny then picks the CHEAPEST model below that lists that
# tier and that you have a key for (on a price tie, the one listed first).
# To add a model, copy an entry and set its tiers. Tier assignments are a
# starting point: the public benchmark calibrates them.

decider:
  id: typesafe-ai/jev
  price: { input: 0.042, output: 0.0 }
  context: 32000

# Writes the plan when a prompt is split. Planning quality is where it pays to spend, so critical
# (tier 4) requests get the strong planner; the rest, where the parts are usually visible in the
# request itself, get a lighter one.
planner: anthropic/claude-sonnet-5
planner_light: google/gemini-3.8-flash

# The "one strong model" every cost receipt compares against.
baseline: anthropic/claude-opus-5.5

tiers:
  1: { name: basic, description: "Trivial or mechanical: a greeting, a short fact, fixing or translating a short text, extracting or classifying, a formula." }
  2: { name: standard, description: "Writing or explaining with a clear goal: an email, a post, a summary, explaining a concept, how-to steps, short code." }
  3: { name: advanced, description: "Several steps, careful reasoning or a lot of context: analysing data or long documents, comparing options, debugging, plans, deliverables." }
  4: { name: critical, description: "Hard reasoning or high stakes: architecture, strategy, proofs, legal, money, health, security." }

# Some kinds of work need at least this tier: the cheapest models slip on arithmetic, logic and code.
min_tier:
  math: 2
  code: 2

task_types:
  code: "Writing, reviewing or debugging code."
  writing: "Writing or rewriting text for people to read."
  analysis: "Analysing, comparing, reasoning or planning."
  research: "Finding and summarising information."
  math: "Calculations, numbers and formal reasoning."
  translation: "Translating between languages."

models:
  - id: openai/gpt-6-luna
    provider: openai
    tiers: [1]
    price: { input: 0.10, output: 0.50 }
    context: 1050000
    vision: true

  - id: alibaba/qwen3.8-flash
    provider: alibaba
    tiers: [1]
    price: { input: 0.15, output: 0.47 }
    context: 991000
    vision: true

  - id: google/gemini-3.5-flash-lite
    provider: google
    tiers: [1, 2]
    price: { input: 0.30, output: 2.50 }
    context: 1000000
    vision: true

  - id: deepseek/deepseek-v4.1-flash
    provider: deepseek
    tiers: [2]
    price: { input: 0.30, output: 1.20 }
    context: 1048576
    vision: true

  - id: anthropic/claude-haiku-4.5
    provider: anthropic
    tiers: [1, 2]
    price: { input: 1.00, output: 5.00 }
    context: 200000
    vision: true

  - id: google/gemini-3.8-flash
    provider: google
    tiers: [2]
    price: { input: 0.75, output: 3.75 }
    context: 1000000
    vision: true

  - id: anthropic/claude-sonnet-5
    provider: anthropic
    tiers: [3]
    price: { input: 2.00, output: 10.00 }
    context: 1000000
    vision: true

  - id: openai/gpt-6-sol
    provider: openai
    tiers: [3]
    price: { input: 2.00, output: 10.00 }
    context: 1050000
    vision: true

  - id: anthropic/claude-opus-5.5
    provider: anthropic
    tiers: [4]
    price: { input: 4.00, output: 20.00 }
    context: 1000000
    vision: true

  - id: anthropic/claude-opus-5
    provider: anthropic
    tiers: [4]
    price: { input: 5.00, output: 25.00 }
    context: 1000000
    vision: true

  - id: openai/gpt-6-astra
    provider: openai
    tiers: [4]
    price: { input: 10.00, output: 50.00 }
    context: 1050000
    vision: true

# Profiles limit which providers the router may use. `taskpenny run --profile anthropic`.
profiles:
  all: [openai, alibaba, google, deepseek, anthropic]
  anthropic: [anthropic]
