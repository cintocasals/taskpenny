# docker compose up   ->  page and API on http://127.0.0.1:8765 (OpenAI base URL: http://127.0.0.1:8765/v1)
# Keys come from your shell or an .env file next to this one; they are never baked into the image.
# AI_GATEWAY_API_KEY is required for real runs (Jev decides every step, through Vercel). Provider keys are
# optional: they take effect only for the providers listed in TASKPENNY_DIRECT.
# For TASKPENNY_API_KEY use a generated key: openssl rand -hex 24
services:
  taskpenny:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - AI_GATEWAY_API_KEY
      - TASKPENNY_API_KEY
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
      - DEEPSEEK_API_KEY
      - DASHSCOPE_API_KEY
      - TASKPENNY_DIRECT
      - TASKPENNY_LOCAL
      - TASKPENNY_CEILING
      - TASKPENNY_MAX_COST
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - taskpenny-runs:/data
  # Optional free local models for basic tasks: uncomment, then `docker compose exec ollama ollama pull qwen3:4b`
  # and set TASKPENNY_LOCAL=qwen3:4b.
  # ollama:
  #   image: ollama/ollama
  #   volumes:
  #     - ollama:/root/.ollama
volumes:
  taskpenny-runs:
  # ollama:
