name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: taskpenny demo --quiet   # the whole flow without a key

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t taskpenny .
      - run: |
          docker run -d --name taskpenny -p 8765:8765 taskpenny
          sleep 5
          # no AI_GATEWAY_API_KEY here: a real request is refused, a dry run is answered and marked simulated
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/v1/chat/completions \
            -H 'Content-Type: application/json' -d '{"model":"taskpenny","messages":[{"role":"user","content":"Hello"}]}')
          test "$code" = 503
          curl -sf http://127.0.0.1:8765/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"model":"taskpenny","messages":[{"role":"user","content":"Hello"}],"taskpenny":{"dry_run":true}}' \
            | grep -q '"simulated": true'
