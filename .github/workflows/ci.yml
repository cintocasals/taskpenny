name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: taskpenny demo --quiet   # the whole flow without a key

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t taskpenny .
      - run: |
          docker run -d --name taskpenny -p 8765:8765 taskpenny
          sleep 5
          curl -sf http://127.0.0.1:8765/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"model":"taskpenny","messages":[{"role":"user","content":"Hello"}]}' | grep -q chat.completion
