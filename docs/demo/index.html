<style>
/* IBM Plex (SIL Open Font License, fonts/OFL.txt), served with the page: no request leaves for a font service */
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url(fonts/IBMPlexSans-Regular.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:swap;src:url(fonts/IBMPlexSans-Medium.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url(fonts/IBMPlexSans-SemiBold.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(fonts/IBMPlexMono-Regular.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/IBMPlexMono-Medium.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;font-display:swap;src:url(fonts/IBMPlexMono-SemiBold.woff2) format("woff2")}
:root{
  --bg:#F4F2ED; --panel:#FAF9F5; --ink:#12161A; --lead:#6E767C; --line:#DCD9D2; --soft:#E9E6DF;
  --oxide:#C1440E; --on-ink:#F4F2ED;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0B0E11; --panel:#12161A; --ink:#ECE9E2; --lead:#9AA1A6; --line:#2A3036; --soft:#1B2026; --oxide:#E0612A; --on-ink:#0B0E11; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 64px;display:grid;gap:24px}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lead)}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;border-bottom:1px solid var(--ink);padding-bottom:12px}
.brand{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:.08em}
.tag{color:var(--lead);flex:1 1 320px}
.mode{font-family:var(--mono);font-size:11px;letter-spacing:.12em;border:1px solid var(--ink);padding:2px 8px;border-radius:2px}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:4px 6px}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:12px;line-height:1.5}
textarea:focus,select:focus,input:focus{outline:2px solid var(--ink);outline-offset:1px}
button{cursor:pointer;border-radius:2px}
.login{border:1px solid var(--line);background:var(--paper);padding:16px}
.login form{display:grid;gap:8px;max-width:520px}.login-hint{margin:0;color:var(--lead);font-size:13px}
.static-note{margin:0;font-size:14px;max-width:78ch}.static-note code{font-family:var(--mono);font-size:13px}.static-note a{color:var(--ink)}
body.static .examples,body.static .opts,body.static .history a.ghost{display:none}
.login-row{display:flex;gap:8px;flex-wrap:wrap}.login-row input{flex:1;min-width:0;padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}
.login-error{margin:0;color:var(--oxide);font-size:13px}
.btn{background:var(--ink);color:var(--on-ink);border:1px solid var(--ink);padding:8px 18px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);padding:4px 10px;font-size:13px}
.ghost:hover,.btn:hover:not(:disabled){outline:1px solid var(--ink)}
a.ghost{color:inherit;text-decoration:none;display:inline-block}
.compose{display:grid;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13px;color:var(--lead)}
.opts label{display:flex;gap:6px;align-items:center}
.examples{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meter{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.meter div{background:var(--panel);padding:12px 14px;display:grid;gap:4px}
.meter b{font-family:var(--mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.meter .save b{color:var(--oxide)}
.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:start}
.panel{border:1px solid var(--line);background:var(--panel)}
.panel > .head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.tree{padding:10px 8px 14px}
.node{position:relative;margin-left:calc(var(--d) * 22px)}
.node::before{content:"";position:absolute;left:-12px;top:0;bottom:0;border-left:1px solid var(--line);display:var(--rail)}
.card{all:unset;box-sizing:border-box;display:grid;grid-template-columns:18px 1fr auto;gap:4px 10px;align-items:baseline;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.card:hover{border-color:var(--ink)}
.card:focus-visible{outline:2px solid var(--ink)}
.card.sel{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.glyph{font-family:var(--mono)}
.running .glyph,.running .nid{color:var(--oxide)}
.running .card{border-color:var(--oxide)}
.done .ttl{color:var(--ink)} .pending .ttl{color:var(--lead)} .failed .ttl{text-decoration:line-through}
.unverified .glyph,.partial .glyph{color:var(--oxide)}
.warnings{border:1px solid var(--oxide);border-left-width:4px;padding:10px 14px;margin:0 14px 14px;font-size:14px}
.warnings b{display:block;margin-bottom:4px}.warnings ul{margin:0;padding-left:18px}
.nid{font-family:var(--mono);font-size:12px;color:var(--lead);margin-right:6px}
.ttl{font-weight:500}
.meta{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:6px 10px;font-family:var(--mono);font-size:11px;color:var(--lead)}
.chip{border:1px solid var(--line);padding:0 5px;border-radius:2px;white-space:nowrap}
.chip.jev{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.cost{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--lead)}
.detail{padding:14px;display:grid;gap:14px}
.detail dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.detail dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lead)}
.detail dd{margin:0;font-family:var(--mono);font-size:13px}
.box{white-space:pre-wrap;word-wrap:break-word;font-size:14px;border-left:2px solid var(--line);padding-left:10px;max-height:340px;overflow:auto}
.answer{padding:18px 20px;max-width:78ch}
.answer h1,.answer h2,.answer h3{font-size:17px;margin:18px 0 6px}
.answer p{margin:0 0 10px}
.answer ul,.answer ol{margin:0 0 10px;padding-left:22px}
.answer code{font-family:var(--mono);font-size:13px;background:var(--soft);padding:0 3px}
.answer pre{font-family:var(--mono);font-size:13px;background:var(--soft);padding:10px;overflow:auto}
.flow{display:flex;flex-wrap:wrap;gap:0;padding:10px 14px;font-family:var(--mono);font-size:12px}
.flow span{padding:4px 10px;border:1px solid var(--line);margin:0 -1px -1px 0;background:var(--bg)}
.flow b{font-weight:600}
.receipt{padding:10px 14px;display:grid;gap:4px;font-family:var(--mono);font-size:13px;max-width:640px}
.receipt div{display:grid;grid-template-columns:1fr auto;gap:12px;border-bottom:1px solid var(--soft);padding:3px 0}
.receipt .tot{font-weight:600;border-bottom:1px solid var(--ink)}
.receipt p{font-family:var(--sans);font-size:13px;color:var(--lead);margin:8px 0 0}
.box.rich{white-space:normal}.box.rich h1,.box.rich h2,.box.rich h3,.box.rich h4{font-size:14px;margin:10px 0 4px}.box.rich p{margin:0 0 8px}.box.rich ul,.box.rich ol{margin:0 0 8px;padding-left:18px}
.legend{margin:0;padding:8px 14px 12px;font-size:12px;color:var(--lead);border-top:1px solid var(--soft)}
.log{max-height:260px;overflow:auto;font-family:var(--mono);font-size:12px;padding:8px 14px}
.log div{display:grid;grid-template-columns:52px 70px 1fr;gap:8px;padding:2px 0;border-bottom:1px solid var(--soft)}
.log .t{color:var(--lead)}
.history{display:grid}
.history .row{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--soft);font-size:13px}
.history .req{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history .row.live{grid-template-columns:1fr auto auto}.history .row.live .cost{color:var(--oxide)}
.empty{padding:18px 14px;color:var(--lead)}
.err{color:var(--oxide);font-family:var(--mono);font-size:13px;padding:0 14px 12px}
footer{font-family:var(--mono);font-size:11px;color:var(--lead);border-top:1px solid var(--line);padding-top:10px}
@media (max-width:860px){.main{grid-template-columns:1fr}}
@media (max-width:520px){.meter{grid-template-columns:1fr 1fr}.meter .save{grid-column:span 2}
  .history .row{grid-template-columns:1fr auto auto auto}.history .req{grid-column:1 / -1;white-space:normal}}
@media (prefers-reduced-motion:no-preference){.running .glyph{animation:blink 1s steps(2,end) infinite}@keyframes blink{50%{opacity:.35}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Taskpenny</span>
    <span class="tag" data-i18n="tagline"></span>
    <span class="mode" id="mode"></span>
    <label class="label" for="lang" data-i18n="language"></label>
    <select id="lang"><option value="en">English</option><option value="ca">Català</option><option value="es">Español</option></select>
    <button class="ghost" id="logout" type="button" hidden data-i18n="logout"></button>
  </header>

  <section class="login" id="login" hidden>
    <form id="login-form">
      <label class="label" for="login-key" data-i18n="loginTitle"></label>
      <p class="login-hint" data-i18n="loginHint"></p>
      <div class="login-row"><input id="login-key" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit" data-i18n="loginButton"></button></div>
      <p class="login-error" id="login-error" hidden data-i18n="loginWrong"></p>
    </form>
  </section>

  <section class="compose" aria-label="request">
    <label class="label" for="req" data-i18n="request"></label>
    <textarea id="req"></textarea>
    <p class="static-note" id="static-note" hidden></p>
    <p class="static-note" id="key-note" hidden data-i18n="noKey"></p>
    <div class="examples"><span class="label" data-i18n="examples"></span></div>
    <div class="opts">
      <label><span data-i18n="profile"></span> <select id="profile"></select></label>
      <label><span data-i18n="budget"></span> $ <input id="budget" type="number" min="0.01" step="0.05" value="0.50" style="width:80px"></label>
      <label><input id="dry" type="checkbox"> <span data-i18n="dry"></span></label>
      <label><input id="nosplit" type="checkbox"> <span data-i18n="nosplit"></span></label>
      <button class="btn" id="run" data-i18n="run"></button>
    </div>
  </section>

  <section class="meter" aria-live="polite">
    <div><span class="label" data-i18n="spent"></span><b id="m-cost">$0.0000</b></div>
    <div><span class="label" data-i18n="calls"></span><b id="m-calls">0</b></div>
    <div><span class="label" data-i18n="time"></span><b id="m-time">0.0 s</b></div>
    <div><span class="label" id="m-base-l" data-i18n="baseline"></span><b id="m-base">-</b></div>
    <div class="save"><span class="label" id="m-save-l" data-i18n="saving"></span><b id="m-save">-</b></div>
  </section>

  <section class="panel" id="flow-box" hidden>
    <div class="head"><span class="label" data-i18n="flow"></span><span class="cost" id="flow-note"></span></div>
    <div class="flow" id="flow"></div>
  </section>

  <section class="main">
    <div class="panel">
      <div class="head"><span class="label" data-i18n="tree"></span><span class="cost" id="status"></span></div>
      <div class="tree" id="tree"><p class="empty" data-i18n="treeEmpty"></p></div>
      <p class="legend" data-i18n="legend"></p>
      <div class="err" id="err" hidden></div>
    </div>
    <div class="panel">
      <div class="head"><span class="label" data-i18n="detail"></span><span class="cost" id="det-id"></span></div>
      <div class="detail" id="detail"><p class="empty" data-i18n="detailEmpty"></p></div>
    </div>
  </section>

  <section class="panel">
    <div class="head"><span class="label" data-i18n="answer"></span><button class="ghost" id="copy" data-i18n="copy"></button></div>
    <div class="answer" id="answer"><p class="empty" data-i18n="answerEmpty"></p></div>
    <div class="warnings" id="warnings" role="status" hidden></div>
  </section>

  <section class="panel" id="receipt-box" hidden>
    <div class="head"><span class="label" data-i18n="receipt"></span><span class="cost" id="receipt-note"></span></div>
    <div class="receipt" id="receipt"></div>
  </section>

  <section class="panel">
    <div class="head"><span class="label" data-i18n="log"></span></div>
    <div class="log" id="log"></div>
  </section>

  <section class="panel">
    <div class="head"><span class="label" data-i18n="history"></span>
      <label class="cost"><span data-i18n="speed"></span> <select id="speed"><option value="1">1×</option><option value="4" selected>4×</option><option value="20">20×</option></select></label></div>
    <div class="history" id="history"></div>
  </section>

  <footer data-i18n="footer"></footer>
</div>

<script>
/* Static demo: the page's API calls are answered from the run below; nothing is sent anywhere. */
(() => {
  const RUN = {"id": "demo-run", "request": "Prepare the launch of our new online course on AI for small businesses: 1) define three buyer personas, 2) write the landing page copy for the main persona, 3) write a 3-email welcome sequence, 4) list 10 LinkedIn post ideas, and 5) for each post idea, decide whether it is educational, promotional or social proof.", "answer": "Everything you need to launch the 'AI for Small Businesses' online course: the buyer personas, landing page copy, welcome emails and a ready-to-publish LinkedIn content plan.\n\n## Target Buyer Personas\n\n# Buyer Personas: AI for Small Businesses Online Course\n\n## Persona 1: \"Overwhelmed Owner\" Olivia — ⭐ PRIMARY/MAIN TARGET\n\n**Background:** 42 years old, owns a boutique marketing/design agency with 5-8 employees. Business degree, not technical. Has run the business for 7 years, growth has plateaued.\n\n**Business Type:** Service-based small business (agency, consultancy, retail, or local service provider)\n\n**Pain Points:**\n- Hears \"AI\" constantly from competitors and media but doesn't know where to start\n- Fears falling behind competitors who already use AI tools\n- Limited time — wears too many hats to experiment with new tech\n- Tried a few AI tools (ChatGPT) but uses them inconsistently and inefficiently\n- Worried about wasting money on the wrong tools/subscriptions\n\n**Goals:**\n- Save time on repetitive tasks (content creation, admin, customer emails)\n- Increase efficiency without hiring more staff\n- Look credible/modern to clients and prospects\n\n**Motivations for Enrolling:**\n- Wants a structured, practical roadmap (not just theory)\n- Needs confidence to make tech decisions without an IT team\n- Seeks quick wins to justify the time/money investment\n\n---\n\n## Persona 2: \"Scaling Operator\" Marcus\n\n**Background:** 35 years old, co-founder of a growing e-commerce brand (15-20 employees). Somewhat tech-savvy, comfortable with software but not AI/ML specifics.\n\n**Business Type:** E-commerce / online retail\n\n**Pain Points:**\n- Drowning in customer service inquiries and inventory management\n- Current tools don't integrate well; considering custom solutions but lacks technical depth\n- Team is skeptical about AI replacing jobs, causing internal friction\n- Needs to justify ROI on any new tech investment to co-founder/investors\n\n**Goals:**\n- Automate customer support and personalize marketing at scale\n- Build a business case for larger AI investments\n- Train his team to adopt tools without resistance\n\n**Motivations for Enrolling:**\n- Wants to move from \"using AI\" to \"strategically implementing AI\"\n- Looking for case studies and frameworks he can bring back to his team\n- Interested in change management alongside technical how-tos\n\n---\n\n## Persona 3: \"Curious Career-Changer\" Priya\n\n**Background:** 29 years old, former corporate employee now launching a solo consulting/freelance business. Tech-curious, active on LinkedIn, self-taught in various digital tools.\n\n**Business Type:** Solopreneur / freelancer / consultant\n\n**Pain Points:**\n- No team to delegate to — needs to be a \"one-person department\" for everything\n- Budget-conscious, hesitant to pay for multiple tools\n- Feels behind more established competitors with bigger resources\n- Overload of free AI content online, hard to know what's credible or applicable\n\n**Goals:**\n- Build an efficient, lean business from day one using AI as a force multiplier\n- Position herself as forward-thinking to attract clients\n- Create scalable systems before revenue grows\n\n**Motivations for Enrolling:**\n- Wants curated, vetted information instead of sifting through free content\n- Values community/networking aspect of a course\n- Motivated by career reinvention and proving capability in new venture\n\n---\n\n## Summary: Why Olivia is Primary\n\nOlivia represents the largest addressable market (established small business owners, non-technical, time-poor but revenue-generating). She has budget authority, urgent pain (competitive anxiety), and clear ROI motivation — making her the ideal core customer to build primary messaging, curriculum pacing, and marketing around. Marcus and Priya represent valuable secondary segments for upsells, testimonials, or tailored modules.\n\n## Main Persona Landing Page Copy\n\n# AI for Small Businesses: Landing Page Copy\n\n---\n\n## HERO SECTION\n\n**Headline:**\nStop Falling Behind. Start Using AI to Save 10+ Hours a Week — Without Hiring an IT Team.\n\n**Subheadline:**\nA step-by-step course built for busy small business owners who don't have time to \"figure out AI\" on their own — just a clear roadmap to real results, starting this week.\n\n**[CTA Button: Get Instant Access]**\n\n---\n\n## THE PROBLEM (Pain Point Section)\n\n### You Know You Should Be Using AI. So Why Does It Still Feel Overwhelming?\n\nYou're running a business, managing a team, serving clients — and now everyone's telling you that you need \"AI\" too.\n\nYou've probably already tried:\n- Opening ChatGPT, typing a few prompts, then forgetting about it for weeks\n- Reading another \"10 AI Tools You Need\" listicle that left you more confused than before\n- Watching competitors post slicker content, respond faster, and seem more \"with it\" — while you wonder what you're missing\n\nMeanwhile, you're stretched thin. You don't have hours to experiment. You don't have an IT department to ask. And you definitely don't have budget to waste on subscriptions you'll never fully use.\n\n**You don't need more information. You need a plan.**\n\n---\n\n## THE SOLUTION\n\n### Introducing \"AI for Small Businesses\" — Your No-Fluff Roadmap to Real Results\n\nThis isn't a technical course. It's not built for engineers or \"AI experts.\" It's built for business owners like you — non-technical, time-poor, and ready for practical wins, not theory.\n\nIn just a few short weeks, you'll go from \"I don't know where to start\" to confidently usi al. Has run the business for 7 years, growth has plateaued.\n\n**Business Type:** Service-based small business (agency, consultancy, retail, or local service provider)\n\n**Pain Points:**\n- Hears \"AI\" constantly from competitors and media but doesn't know where to start\n- Fears falling behind competitors who already use AI tools\n- Limited time — wears too many hats to experiment with new tech\n- Tried a few AI tools (ChatGPT) but uses them inconsistently and inefficiently\n- Worried about wasting money on the wrong tools/subscriptions\n\n**Goals:**\n- Save time on repetitive tasks (content creation, admin, customer emails)\n- Increase efficiency without hiring more staff\n- Look credible/modern to clients and prospects\n\n**Motivations for Enrolling:**\n- Wants a structured, practical roadmap (not just theory)\n- Needs confidence to make tech decisions without an IT team\n- Seeks quick wins to justify the time/money investment\n\n---\n\n## Persona 2: \"Scaling Operator\" Marcus\n\n**Background:** 35 years old, co-founder of a growing e-commerce brand (15-20 employees). Somewhat tech-savvy, comfortable with software but not AI/ML specifics.\n\n**Business Type:** E-commerce / online retail\n\n**Pain Points:**\n- Drowning in customer service inquiries and inventory management\n- Current tools don't integrate well; considering custom solutions but lacks technical depth\n- Team is skeptical about AI replacing jobs, causing internal friction\n- Needs to justify ROI on any new tech investment to co-founder/investors\n\n**Goals:**\n- Automate customer support and personalize marketing at scale\n- Build a business case for larger AI investments\n- Train his team to adopt tools without resistance\n\n**Motivations for Enrolling:**\n- Wants to move from \"using AI\" to \"strategically implementing AI\"\n- Looking for case studies and frameworks he can bring back to his team\n- Interested in change management alongside technical how-tos\n\n---\n\n## Persona 3: \"Curious Career-Changer\" Priya\n\n**Background:** 29 years old, former corporate employee now launching a solo consulting/freelance business. Tech-curious, active on LinkedIn, self-taught in various digital tools.\n\n**Business Type:** Solopreneur / freelancer / consultant\n\n**Pain Points:**\n- No team to delegate to — needs to be a \"one-person department\" for everything\n- Budget-conscious, hesitant to pay for multiple tools\n- Feels behind more established competitors with bigger resources\n- Overload of free AI content online, hard to know what's credible or applicable\n\n**Goals:**\n- Build an efficient, lean business from day one using AI as a force multiplier\n- Position herself as forward-thinking to attract clients\n- Create scalable systems before revenue grows\n\n**Motivations for Enrolling:**\n- Wants curated, vetted information instead of sifting through free content\n- Values community/networking aspect of a course\n- Motivated by career reinvention and proving capability in new venture\n\n---\n\n## Summary: Why Olivia is Primary\n\nOlivia represents the largest addressable market (established small business owners, non-technical, time-poor but revenue-generating). She has budget authority, urgent pain (competitive anxiety), and clear ROI motivation — making her the ideal core customer to build primary messaging, curriculum pacing, and marketing around. Marcus and Priya represent valuable secondary segments for upsells, testimonials, or tailored modules.", "notes": "- Olivia (\"Overwhelmed Owner\") is the PRIMARY persona — non-technical small business owner, service-based, values quick practical wins and structured roadmaps.\n- Marketing copy/curriculum should prioritize Olivia's pain points: time scarcity, fear of falling behind, low tech confidence, ROI justification.\n- Secondary personas (Marcus - scaling e-commerce operator, Priya - solo career-changer) can inform upsell modules, testimonials, or bonus content but shouldn't drive core positioning.\n- All personas share a need for curated/trustworthy AI guidance vs. overwhelming free content — emphasize course credibility and structure in messaging.\n- Consider tiered course tracks or bonus modules to address Marcus's team-training needs and Priya's budget-conscious solo-preneur angle without diluting core messaging for Olivia.", "problem": "", "attempts": [{"model": "anthropic/claude-sonnet-5", "tier": 3, "ok_probability": 0.98}], "cost": 0.016208, "tokens_in": 2446, "tokens_out": 1576, "children": [], "started": 8.252257084008306, "ended": 28.56419104197994}, "t2": {"id": "t2", "title": "Write landing page copy", "prompt": "Using the buyer personas defined in {t1}, write high-converting landing page copy tailored specifically to the main persona for the 'AI for Small Businesses' online course. Include: engaging headline and subheadline, problem/pain point section, solution/course overview, key curriculum modules/benefits, social proof/testimonial placeholders, and strong calls to action (CTAs).", "depth": 1, "parent": "root", "criteria": "Compelling landing page copy speaking directly to the main persona's specific challenges and goals with clear CTAs.", "answer_type": "text", "decision": null, "depends_on": ["t1"], "status": "done", "kind": "llm", "gate": {"split": 0.61, "tier": 3, "tier_raw": 3, "tier_confidence": 0.36, "raised": false, "floored": false, "task_type": "writing", "answer_type": "text"}, "model": "anthropic/claude-sonnet-5", "tier": 3, "result": "# AI for Small Businesses: Landing Page Copy\n\n---\n\n## HERO SECTION\n\n**Headline:**\nStop Falling Behind. Start Using AI to Save 10+ Hours a Week — Without Hiring an IT Team.\n\n**Subheadline:**\nA step-by-step course built for busy small business owners who don't have time to \"figure out AI\" on their own — just a clear roadmap to real results, starting this week.\n\n**[CTA Button: Get Instant Access]**\n\n---\n\n## THE PROBLEM (Pain Point Section)\n\n### You Know You Should Be Using AI. So Why Does It Still Feel Overwhelming?\n\nYou're running a business, managing a team, serving clients — and now everyone's telling you that you need \"AI\" too.\n\nYou've probably already tried:\n- Opening ChatGPT, typing a few prompts, then forgetting about it for weeks\n- Reading another \"10 AI Tools You Need\" listicle that left you more confused than before\n- Watching competitors post slicker content, respond faster, and seem more \"with it\" — while you wonder what you're missing\n\nMeanwhile, you're stretched thin. You don't have hours to experiment. You don't have an IT department to ask. And you definitely don't have budget to waste on subscriptions you'll never fully use.\n\n**You don't need more information. You need a plan.**\n\n---\n\n## THE SOLUTION\n\n### Introducing \"AI for Small Businesses\" — Your No-Fluff Roadmap to Real Results\n\nThis isn't a technical course. It's not built for engineers or \"AI experts.\" It's built for business owners like you — non-technical, time-poor, and ready for practical wins, not theory.\n\nIn just a few short weeks, you'll go from \"I don't know where to start\" to confidently using AI tools that save you hours every week — on content, admin, customer communication, and more.\n\n**No coding. No jargon. No wasted time.**\n\n---\n\n## WHAT YOU'LL LEARN (Curriculum Highlights)\n\n✅ **Module 1: The AI Quick-Start Framework**\nCut through the noise and identify the 3-5 AI tools that will actually move your business forward — skip the rest.\n\n✅ **Module 2: Reclaim Your Time**\nAutomate repetitive tasks like content creation, email responses, and scheduling — freeing up hours every week for the work only you can do.\n\n✅ **Module 3: AI-Powered Client Communication**\nUse AI to draft proposals, respond to inquiries, and follow up with prospects — faster and more professionally than ever.\n\n✅ **Module 4: Look Modern, Stay Credible**\nLearn how to integrate AI into your workflow in a way that impresses clients and prospects — without ever feeling like a gimmick.\n\n✅ **Module 5: Your 30-Day AI Action Plan**\nLeave with a clear, personalized roadmap so you know exactly what to implement next — no more guessing.\n\n**Bonus:** Templates, prompt libraries, and tool comparison cheat sheets so you never waste money on the wrong subscription again.\n\n---\n\n## SOCIAL PROOF\n\n> \"I went from dreading 'AI' as one more thing on my to-do list to actually using it every single day. I got back at least 8 hours a week.\" — **[Name], Owner of [Boutique Agency]**\n\n> \"I finally feel like I'm not falling behind my competitors. This course gave me the confidence to make decisions without needing an IT person.\" — **[Name], Small Business Owner**\n\n> \"Practical, clear, and zero fluff. Exactly what I needed.\" — **[Name], [Business Type]**\n\n**[Insert course completion stats, e.g., \"Join 1,200+ business owners who've completed this course\"]**\n\n---\n\n## FINAL CTA SECTION\n\n### You Don't Have to Figure This Out Alone.\n\nEvery day you wait is another day competitors pull further ahead — and another day you're stuck doing manually what AI could do for you in minutes.\n\nGet the structured, practical roadmap you need to start saving time and looking sharp to clients — starting this week.\n\n**[CTA Button: Enroll Now — Start Saving Time Today]**\n\n*30-day money-back guarantee. No tech experience required.*\n\n---", "notes": "- Copy is built entirely around Olivia (primary persona): non-technical, time-poor, fears falling behind, needs ROI justification and structured roadmap.\n- Testimonial placeholders need real names/business types filled in before publishing — currently generic bracketed placeholders.\n- CTA language emphasizes urgency (competitive fear) and low-risk trial (money-back guarantee) — keep consistent in any follow-up email/ad copy.\n- Curriculum modules reference \"Module 1-5\" — if actual course curriculum differs, module names/order must be reconciled with real course content.\n- Secondary personas (Marcus, Priya) not addressed on this main page — recommend separate landing page sections, upsells, or bonus content pages for those segments per earlier notes.", "problem": "", "attempts": [{"model": "anthropic/claude-sonnet-5", "tier": 3, "ok_probability": 0.76}], "cost": 0.020142, "tokens_in": 4225, "tokens_out": 1644, "children": [], "started": 28.56435458397027, "ended": 50.31802541704383}, "t3": {"id": "t3", "title": "Write welcome email sequence", "prompt": "Write a 3-email welcome sequence for new subscribers or enrollees of the 'AI for Small Businesses' online course. Email 1: Welcome, course access details/expectations, quick win. Email 2: Overcoming common AI overwhelm/mindset barrier and key practical framework. Email 3: Community/support resource and a challenge to take the first action. Ensure tone is supportive, practical, and business-oriented.", "depth": 1, "parent": "root", "criteria": "Three polished emails with subject lines and body copy that guide new students through onboarding and early engagement.", "answer_type": "text", "decision": null, "depends_on": [], "status": "done", "kind": "llm", "gate": {"split": 0.79, "tier": 2, "tier_raw": 2, "tier_confidence": 0.81, "raised": false, "floored": false, "task_type": "writing", "answer_type": "text"}, "model": "deepseek/deepseek-v4.1-flash", "tier": 2, "result": "**Email 1: Welcome — You're In (Here's How to Start)**\n\nSubject: Welcome to AI for Small Businesses — your access + your first quick win\n\nHi [First Name],\n\nWelcome aboard! You've just joined a group of small business owners who are done *watching* the AI wave and are ready to *use* it. I'm glad you're here.\n\n**Your access details**\n- **Login:** [Course portal URL]\n- **Your credentials:** Use the email you signed up with; reset your password here if needed: [Password reset link]\n- **Where to start:** Module 1, Lesson 1 — \"What AI Can (and Can't) Do for a Business Like Yours\"\n- **Support:** Reply to this email or write to [support email]. We answer within one business day.\n\n**What to expect**\nThis course is built for busy owners. Total time commitment is about [X hours] across [Y] modules, and every lesson ends with a practical action, not theory. You don't need a technical background — if you can use email and a spreadsheet, you're ready.\n\n**Your quick win (do this in the next 10 minutes)**\nOpen Module 1, Lesson 1 and complete the \"Three Tasks I Could Hand Off\" worksheet. Write down just three recurring tasks in your business — replying to FAQs, drafting social posts, summarizing customer feedback. That's it. You've already done the hardest part: identifying where AI can save you real hours.\n\nTomorrow, I'll share the one mindset shift that trips up most business owners — and how to skip it.\n\nTalk soon,\n[Your Name]\n[Course/Company]\n\n---\n\n**Email 2: The Overwhelm Trap — and a Simple Framework**\n\nSubject: Feeling behind on AI? Read this before you do anything else\n\nHi [First Name],\n\nQuick question: have you felt that knot in your stomach yet — the \"there's too much AI stuff, I don't know where to start\" feeling?\n\nAlmost everyone does in week one. So let's defuse it right now.\n\n**The overwhelm trap**\nMost owners treat AI like a new full-time job to master. They binge articles, collect 40 tools, and end up using none of them. That's not a knowledge problem — it's a focus problem. You don't need to know AI. You need one task in your business to get easier.\n\n**The framework: Pick One Task, One Tool, One Hour**\n- **One task:** Choose the single most repetitive, low-risk task from your worksheet (customer FAQ replies are a great candidate).\n- **One tool:** Pick one assistant — [recommended starter tool, e.g., ChatGPT/Claude] — and ignore every other tool for 30 days.\n- **One hour:** Block 60 minutes this week. Spend 20 drafting your prompts, 20 testing on real examples, 20 editing the output until it sounds like you.\n\nThat's your entire assignment.  pick the right tool.\n\n---", "notes": "- Sequence targets new subscribers/enrollees of an 'AI for Small Businesses' course; tone is supportive, practical, business-oriented.\n- Placeholders needing replacement: [First Name], [Course portal URL], [Password reset link], [support email], module/time counts ([X hours], [Y] modules), [recommended starter tool], [Community name/forum link], [Day/time], [Registration link], [Module X].\n- Email 1 includes access details, expectations, and a 10-minute quick win (worksheet: identify three tasks).\n- Email 2 uses the framework \"Pick One Task, One Tool, One Hour,\" addresses overwhelm mindset, 30-day single-tool rule.\n- Email 3 gives support resources + a 4-step challenge with a community post prompt; CTA consistency assumes a community forum and Prompt Library exist in the course.", "problem": "", "attempts": [{"model": "deepseek/deepseek-v4.1-flash", "tier": 2, "ok_probability": 0.96}], "cost": 0.0015633, "tokens_in": 2766, "tokens_out": 1257, "children": [], "started": 8.252637334051542, "ended": 16.533394749974832}, "t4": {"id": "t4", "title": "Generate LinkedIn post ideas", "prompt": "List 10 specific LinkedIn post ideas to promote the 'AI for Small Businesses' online course launch. For each post idea, provide a clear title, a brief concept/hook, and the main takeaway for small business owners.", "depth": 1, "parent": "root", "criteria": "10 distinct, relevant LinkedIn post concepts tailored for small business owners exploring AI.", "answer_type": "text", "decision": null, "depends_on": [], "status": "done", "kind": "llm", "gate": {"split": 0.76, "tier": 2, "tier_raw": 2, "tier_confidence": 0.64, "raised": false, "floored": false, "task_type": "writing", "answer_type": "text"}, "model": "deepseek/deepseek-v4.1-flash", "tier": 2, "result": "1. **Title:** \"I Automated My Entire Invoicing Process in One Afternoon\"  \n   **Hook:** Share a before-and-after story of a small business owner drowning in admin work, then show ite to [support email]. We answer within one business day.\n\n**What to expect**\nThis course is built for busy owners. Total time commitment is about [X hours] across [Y] modules, and every lesson ends with a practical action, not theory. You don't need a technical background — if you can use email and a spreadsheet, you're ready.\n\n**Your quick win (do this in the next 10 minutes)**\nOpen Module 1, Lesson 1 and complete the \"Three Tasks I Could Hand Off\" worksheet. Write down just three recurring tasks in your business — replying to FAQs, drafting social posts, summarizing customer feedback. That's it. You've already done the hardest part: identifying where AI can save you real hours.\n\nTomorrow, I'll share the one mindset shift that trips up most business owners — and how to skip it.\n\nTalk soon,\n[Your Name]\n[Course/Company]\n\n---\n\n**Email 2: The Overwhelm Trap — and a Simple Framework**\n\nSubject: Feeling behind on AI? Read this before you do anything else\n\nHi [First Name],\n\nQuick question: have you felt that knot in your stomach yet — the \"there's too much AI stuff, I don't know where to start\" feeling?\n\nAlmost everyone does in week one. So let's defuse it right now.\n\n**The overwhelm trap**\nMost owners treat AI like a new full-time job to master. They binge articles, collect 40 tools, and end up using none of them. That's not a knowledge problem — it's a focus problem. You don't need to know AI. You need one task in your business to get easier.\n\n**The framework: Pick One Task, One Tool, One Hour**\n- **One task:** Choose the single most repetitive, low-risk task from your worksheet (customer FAQ replies are a great candidate).\n- **One tool:** Pick one assistant — [recommended starter tool, e.g., ChatGPT/Claude] — and ignore every other tool for 30 days.\n- **One hour:** Block 60 minutes this week. Spend 20 drafting your prompts, 20 testing on real examples, 20 editing the output until it sounds like you.\n\nThat's your entire assignment. Not \"learn AI.\" Just: make one task easier this week.\n\n**A mindset reminder**\nAI is a junior assistant, not an oracle. Its first draft will be imperfect — that's normal and expected. Your job is to edit, not to be impressed. Owners who succeed with AI are not the most technical; they're the ones who keep showing up for 15 minutes a day.\n\nHit reply and tell me which task you picked. I read every response.\n\n[Your Name]\n\n---\n\n**Email 3: You're Not Doing This Alone — Your First Challenge**\n\nSubject: Your first challenge (and where to get help when you're stuck)\n\nHi [First Name],\n\nBy now you've got your access, your three tasks, and your one-task plan. The last piece is the one that separates people who finish from people who stall: support.\n\n**Where to get help**\n- **Community:** Join the [Community name/forum link] — ask questions, share wins, see what other owners are automating. Real answers from real businesses, usually within a few hours.\n- **Live Q&A:** [Day/time] — bring your specific task and we'll work through it together. [Registration link]\n- **Direct support:** [Support email] for anything technical or billing-related.\n- **Templates:** The Prompt Library in Module [X] has ready-to-use prompts for the most common small-business tasks. Steal them.\n\n**Your challenge: take the first action this week**\nHere it is, and it's deliberately small:\n\n1. Pick your one task.\n2. Run it through your one tool using a Prompt Library template.\n3. Edit the result until it sounds like your business.\n4. Post your result — success or mess — in the community thread \"[Challenge] My First AI Task.\"\n\nWhy post it? Because the owners who share their first (imperfect) attempt are the ones still using AI three months later. Progress comes from doing, not studying.\n\nYou've got the plan, the tools, and the people. All that's left is the first rep.\n\nSee you in the community,\n[Your Name]\n\nP.S. Stuck on step 1? Reply with your task and I'll help you pick the right tool.\n\n---", "notes": "- Sequence targets new subscribers/enrollees of an 'AI for Small Businesses' course; tone is supportive, practical, business-oriented.\n- Placeholders needing replacement: [First Name], [Course portal URL], [Password reset link], [support email], module/time counts ([X hours], [Y] modules), [recommended starter tool], [Community name/forum link], [Day/time], [Registration link], [Module X].\n- Email 1 includes access details, expectations, and a 10-minute quick win (worksheet: identify three tasks).\n- Email 2 uses the framework \"Pick One Task, One Tool, One Hour,\" addresses overwhelm mindset, 30-day single-tool rule.\n- Email 3 gives support resources + a 4-step challenge with a community post prompt; CTA consistency assumes a community forum and Prompt Library exist in the course.", "problem": "", "attempts": [{"model": "deepseek/deepseek-v4.1-flash", "tier": 2, "ok_probability": 0.96}]}, {"t": 19.303, "type": "llm_call", "node": "t4", "role": "work", "model": "deepseek/deepseek-v4.1-flash", "tokens_in": 143, "tokens_out": 855, "cost": 0.0010689, "cost_source": "gateway", "latency_ms": 10746}, {"t": 19.546, "type": "verify", "node": "t4", "ok": true, "probability": 0.94, "attempt": 1, "cost": 0.0}, {"t": 19.546, "type": "node_done", "node": "t4", "status": "done", "model": "deepseek/deepseek-v4.1-flash", "tier": 2, "cost": 0.001069, "kind": "llm", "result": "1. **Title:** \"I Automated My Entire Invoicing Process in One Afternoon\"  \n   **Hook:** Share a before-and-after story of a small business owner drowning in admin work, then show how one AI tool cut it to minutes.  \n   **Takeaway:** AI isn't just for tech giants—simple automation can give you back hours every week.\n\n2. **Title:** \"The 3 AI Tools Every Small Business Owner Should Try This Month\"  \n   **Hook:** Quick, jargon-free demo of three accessible tools (e.g., ChatGPT for emails, Canva AI for social posts, Zapier for workflows).  \n   **Takeaway:** You don't need a tech team to start; pick one tool, test it on a real task, and scale from there.\n\n3. **Title:** \"Why Your Competitor Just Answered a Customer at 2 AM (And You Didn't)\"  \n   **Hook:** Contrast a business using an AI chatbot for after-hours support with one that loses leads overnight.  \n   **Takeaway:** AI-powered customer service can keep you competitive without hiring night staff.\n\n4. **Title:** \"I Asked AI to Write My Marketing Plan—Here's What Happened\"  \n   **Hook:** Screen-record or screenshot the AI's output, then critique what worked and what needed human tweaking.  \n   **Takeaway:** AI is a drafting partner, not a replacement—use it to beat the blank page, then add your expertise.\n\n5. **Title:** \"The $0 AI Stack for Solopreneurs\"  \n   **Hook:** List free or freemium AI tools that cover writing, design, scheduling, and bookkeeping.  \n   **Takeaway:** You can build a powerful AI toolkit without spending a dime—start free, upgrade only when it pays for itself.\n\n6. **Title:** \"Stop Hiring for This One Task (AI Can Do It Better)\"  \n   **Hook:** Pick a repetitive, low-value task (e.g., data entry, basic bookkeeping) and show AI doing it faster and cheaper.  \n   **Takeaway:** Reallocate your budget from repetitive tasks to growth activities by letting AI handle the busywork.\n\n7. **Title:** \"The 5-Minute AI Audit for Your Small Business\"  \n   **Hook:** Walk through a simple checklist: Where do you lose time? What's repetitive? What's error-prone? Then match each to an AI solution.  \n   **Takeaway:** You don't need a big strategy—just identify one pain point and apply one AI tool to solve it.\n\n8. **Title:** \"I Trained an AI on My Best Sales Emails—Response Rate Jumped 40%\"  \n   **Hook:** Tell a mini case study of feeding past winning emails into an AI to generate new outreach.  \n   **Takeaway:** Your existing data is a goldmine—use AI to learn from what already works and replicate it at scale.\n\n9. **Title:** \"The Biggest AI Mistake Small Business Owners Make\"  \n   **Hook:** Warn against over-automating customer relationships or trusting AI output without editing.  \n   **Takeaway:** Use AI for speed and drafts, but keep the human touch where it matters most—trust and relationships.\n\n10. **Title:** \"From Overwhelmed to Organized: How AI Transformed My Week\"  \n    **Hook:** Day-in-the-life post showing AI handling email triage, scheduling, and content creation, freeing up time for strategy.  \n    **Takeaway:** AI can be your virtual assistant—start small, build routines, and reclaim your time for what only you can do.", "notes": "- These 10 ideas target small business owners with a practical, non-technical tone.\n- Each post includes a title, hook/concept, and takeaway as requested.\n- Recurring themes: time savings, cost reduction, customer service, marketing, and human-AI balance.\n- No specific course name, price, or link included—later tasks may need to add CTA and branding.\n- Ideas are platform-agnostic for LinkedIn but assume text + optional media (images/video).", "problem": "", "attempts": [{"model": "deepseek/deepseek-v4.1-flash", "tier": 2, "ok_probability": 0.94}]}, {"t": 28.257, "type": "llm_call", "node": "t1", "role": "work", "model": "anthropic/claude-sonnet-5", "tokens_in": 224, "tokens_out": 1576, "cost": 0.016208, "cost_source": "gateway", "latency_ms": 19737}, {"t": 28.564, "type": "verify", "node": "t1", "ok": true, "probability": 0.98, "attempt": 1, "cost": 0.0}, {"t": 28.564, "type": "node_done", "node": "t1", "status": "done", "model": "anthropic/claude-sonnet-5", "tier": 3, "cost": 0.016208, "kind": "llm", "result": "# Buyer Personas: AI for Small Businesses Online Course\n\n## Persona 1: \"Overwhelmed Owner\" Olivia — ⭐ PRIMARY/MAIN TARGET\n\n**Background:** 42 years old, owns a boutique marketing/design agency with 5-8 employees. Business degree, not technical. Has run the business for 7 years, growth has plateaued.\n\n**Business Type:** Service-based small business (agency, consultancy, retail, or local service provider)\n\n**Pain Points:**\n- Hears \"AI\" constantly from competitors and media but doesn't know where to start\n- Fears falling behind competitors who already use AI tools\n- Limited time — wears too many hats to experiment with new tech\n- Tried a few AI tools (ChatGPT) but uses them inconsistently and inefficiently\n- Worried about wasting money on the wrong tools/subscriptions\n\n**Goals:**\n- Save time on repetitive tasks (content creation, admin, customer emails)\n- Increase efficiency without hiring more staff\n- Look credible/modern to clients and prospects\n\n**Motivations for Enrolling:**\n- Wants a structured, practical roadmap (not just theory)\n- Needs confidence to make tech decisions without an IT team\n- Seeks quick wins to justify the time/money investment\n\n---\n\n## Persona 2: \"Scaling Operator\" Marcus\n\n**Background:** 35 years old, co-founder of a growing e-commerce brand (15-20 employees). Somewhat tech-savvy, comfortable with software but not AI/ML specifics.\n\n**Business Type:** E-commerce / online retail\n\n**Pain Points:**\n- Drowning in customer service inquiries and inventory management\n- Current tools don't integrate well; considering custom solutions but lacks technical depth\n- Team is skeptical about AI replacing jobs, causing internal friction\n- Needs to justify ROI on any new tech investment to co-founder/investors\n\n**Goals:**\n- Automate customer support and personalize marketing at scale\n- Build a business case for larger AI investments\n- Train his team to adopt tools without resistance\n\n**Motivations for Enrolling:**\n- Wants to move from \"using AI\" to \"strategically implementing AI\"\n- Looking for case studies and frameworks he can bring back to his team\n- Interested in change management alongside technical how-tos\n\n---\n\n## Persona 3: \"Curious Career-Changer\" Priya\n\n**Background:** 29 years old, former corporate employee now launching a solo consulting/freelance business. Tech-curious, active on LinkedIn, self-taught in various digital tools.\n\n**Business Type:** Solopreneur / freelancer / consultant\n\n**Pain Points:**\n- No team to delegate to — needs to be a \"one-person department\" for everything\n- Budget-conscious, hesitant to pay for multiple tools\n- Feels behind more established competitors with bigger resources\n- Overload of free AI content online, hard to know what's credible or applicable\n\n**Goals:**\n- Build an efficient, lean business from day one using AI as a force multiplier\n- Position herself as forward-thinking to attract clients\n- Create scalable systems before revenue grows\n\n**Motivations for Enrolling:**\n- Wants curated, vetted information instead of sifting through free content\n- Values community/networking aspect of a course\n- Motivated by career reinvention and proving capability in new venture\n\n---\n\n## Summary: Why Olivia is Primary\n\nOlivia represents the largest addressable market (established small business owners, non-technical, time-poor but revenue-generating). She has budget authority, urgent pain (competitive anxiety), and clear ROI motivation — making her the ideal core customer to build primary messaging, curriculum pacing, and marketing around. Marcus and Priya represent valuable secondary segments for upsells, testimonials, or tailored modules.", "notes": "- Olivia (\"Overwhelmed Owner\") is the PRIMARY persona — non-technical small business owner, service-based, values quick practical wins and structured roadmaps.\n- Marketing copy/curriculum should prioritize Olivia's pain points: time scarcity, fear of falling behind, low tech confidence, ROI justification.\n- Secondary personas (Marcus - scaling e-commerce operator, Priya - solo career-changer) can inform upsell modules, testimonials, or bonus content but shouldn't drive core positioning.\n- All personas share a need for curated/trustworthy AI guidance vs. overwhelming free content — function fresh(){ return {nodes:Object.create(null), order:[], cost:0, calls:0, t:0, receipt:null, answer:"", status:"", log:[], error:"", warnings:[]}; }

function node(id){ if (!S.nodes[id]) { S.nodes[id] = {id, title:id, status:"pending", children:[], depth:0}; S.order.push(id); } return S.nodes[id]; }

function apply(ev){
  S.t = Math.max(S.t, ev.t || 0);
  const n = ev.node ? node(ev.node) : null;
  switch (ev.type) {
    case "run_started": n.title = "Request"; n.prompt = ev.request; n.status = "running"; break;
    case "node_started": Object.assign(n, {title: ev.title, depth: ev.depth, parent: ev.parent, prompt: ev.prompt, criteria: ev.criteria, jev: ev.jev, status: "running"});
      if (ev.parent) { const p = node(ev.parent); if (!p.children.includes(n.id)) p.children.push(n.id); } break;
    case "gate": n.gate = ev; n.tier = ev.tier; break;
    case "plan": n.kind = "split"; n.planModel = ev.model; ev.subtasks.forEach(s => { const c = node(s.id); c.title = s.title; c.parent = n.id; c.depth = (n.depth || 0) + 1; c.jev = s.jev;
      if (!n.children.includes(s.id)) n.children.push(s.id); }); break;
    case "split_rejected": n.children.forEach(id => { delete S.nodes[id]; S.order = S.order.filter(x => x !== id); });
      n.children = []; n.kind = "llm"; n.planRejected = true; S.calls += (ev.parts_tiers || []).length; break;
    case "route": n.model = ev.model; n.tier = ev.tier; n.kind = "llm"; break;
    case "llm_call": S.cost += ev.cost || 0; S.calls++; break;
    case "jev_solve": n.kind = "jev"; n.jev = true; n.model = info.decider || "typesafe-ai/jev"; break;
    case "aggregate": n.model = ev.model; break;
    case "model_fallback": n.model = ev.next; break;
    case "node_done": Object.assign(n, {status: ev.status, model: ev.model || n.model, tier: ev.tier, cost: ev.cost, kind: ev.kind || n.kind,
      result: ev.result, notes: ev.notes, problem: ev.problem, attempts: ev.attempts, warning: ev.warning,
      tokensIn: ev.tokens_in, tokensOut: ev.tokens_out, seconds: ev.seconds}); break;
    case "run_done": S.receipt = ev.receipt; S.answer = ev.answer || S.answer; S.status = ev.status; S.cost = ev.receipt ? ev.receipt.total_cost : S.cost;
      if (ev.error) S.error = ev.error; if (Array.isArray(ev.warnings)) S.warnings = ev.warnings.slice(); break;
    case "warning": if (!S.warnings.includes(ev.message)) S.warnings.push((ev.node && ev.node !== "root" ? ev.node + ": " : "") + ev.message); break;
    case "error": case "budget_exceeded": case "node_failed": S.error = ev.message; break;
  }
  if (["gate","verify","jev_solve","final_check","plan"].includes(ev.type)) { S.cost += ev.cost || 0; S.calls++; }
  S.log.push(ev);
}

function glyph(st){ return {done:"■", running:"▶", failed:"⊠", pending:"□", unverified:"◩", partial:"◧"}[st] || "□"; }

function md(text){
  const lines = esc(text).split("\n"); let out = "", list = null, code = false;
  const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const close = () => { if (list) { out += "</" + list + ">"; list = null; } };
  for (const ln of lines) {
    if (ln.trim().startsWith("```")) { close(); out += code ? "</pre>" : "<pre>"; code = !code; continue; }
    if (code) { out += ln + "\n"; continue; }
    let m;
    if ((m = ln.match(/^(#{1,3})\s+(.*)/))) { close(); out += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"; }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(m[1]) + "</li>"; }
    else if ((m = ln.match(/^\s*(\d+)[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += '<ol start="' + m[1] + '">'; list = "ol"; } out += "<li>" + inline(m[2]) + "</li>"; }
    else if (!ln.trim()) { close(); }
    else { close(); out += "<p>" + inline(ln) + "</p>"; }
  }
  close(); if (code) out += "</pre>";
  return out;
}

function renderLog(){
  const box = $("log"); box.replaceChildren();
  S.log.slice(-400).forEach(ev => {
    if (ev.type === "node_started" || ev.type === "llm_call") return;
    const d = document.createElement("div");
    let what = "";
    if (ev.type === "gate") what = L.tier + " " + ev.tier + " · " + ((L.types && L.types[ev.task_type]) || ev.task_type) + " · " + L.split + " " + (ev.split * 100).toFixed(0) + "%";
    else if (ev.type === "plan") what = ev.subtasks.length + " · " + short(ev.model);
    else if (ev.type === "split_rejected") what = L.tier + " " + (ev.parts_tiers || []).join(", ");
    else if (ev.type === "route" || ev.type === "aggregate") what = short(ev.model) + (ev.tier ? " T" + ev.tier : "");
    else if (ev.type === "verify" || ev.type === "final_check") what = ev.ok == null ? "?" : (ev.ok ? "ok" : "✗") + " " + ev.probability;
    else if (ev.type === "jev_extract") what = ev.items + " · " + ((L.types && L.types[ev.kind]) || ev.kind);
    else if (ev.type === "jev_declined") what = ev.reason || "";
    else if (ev.type === "jev_solve") what = ev.items + (ev.unsure && ev.unsure.length ? " (" + ev.unsure.length + "?)" : "");
    else if (ev.type === "node_done") what = (ev.status !== "done" ? (L[ev.status] || ev.status) + " · " : "") + (ev.model ? short(ev.model) : "") + (ev.cost ? " · " + money(ev.cost) : "");
    else if (ev.type === "model_fallback") what = short(ev.model) + " → " + short(ev.next);
    else if (ev.message) what = ev.message;
    else if (ev.type === "run_done") what = (L[ev.status] || ev.status) + " · " + money(ev.cost);
    d.innerHTML = '<span class="t">' + (ev.t || 0).toFixed(1) + 's</span><span>' + esc(ev.node || "") + "</span><span>" + esc((L.ev[ev.type] || ev.type) + (what ? " · " + what : "")) + "</span>";
    box.append(d);
  });
  if (!S.status) box.scrollTop = box.scrollHeight; else box.scrollTop = 0;
}

let raf = 0;
function schedule(){ if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderAll(); }); }

function stopAll(){ if (es) { es.close(); es = null; } if (replayTimer) { clearTimeout(replayTimer); replayTimer = null; } }

async function run(){
  const request = $("req").value.trim(); if (!request) { $("req").focus(); return; }
  stopAll(); S = fresh(); selected = "root"; renderAll();
  $("run").disabled = true; $("run").textContent = L.running;
  try {
    const r = await fetch("/api/run", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({request, dry_run: $("dry").checked, profile: $("profile").value, max_cost: parseFloat($("budget").value) || 0.5, no_split: $("nosplit").checked})});
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
    S.dry = !!j.dry_run;
    follow(j.id);
  } catch (e) { S.error = String(e.message || e); renderAll(); done(); }
}
function follow(id){
  es = new EventSource("/api/events/" + encodeURIComponent(id));
  es.onmessage = m => { const ev = JSON.parse(m.data); if (ev.type === "llm_call" && ev.cost_source === "simulated") S.dry = true; apply(ev); schedule(); };
  es.addEventListener("result", m => {  // the whole run: the answer in full (run_done carries only its first 30,000 characters)
    try { const r = JSON.parse(m.data); if (r && typeof r.answer === "string") S.answer = r.answer; if (r && Array.isArray(r.warnings)) S.warnings = r.warnings.slice(); } catch (e) {}
    stopAll(); done(); });
  es.onerror = () => { if (S.status) { stopAll(); done(); } };
}
async function watch(r){
  stopAll(); S = fresh(); selected = "root"; $("req").value = r.request; renderAll();
  $("run").disabled = true; $("run").textContent = L.running;
  follow(r.id);
}
let liveKey = "";
async function pollLive(){
  let live = [];
  try { live = await (await fetch("/api/live")).json(); } catch (e) { return; }
  if (!Array.isArray(live)) return;
  const key = live.map(r => r.id).join(",");
  if (key !== liveKey) { liveKey = key; loadHistory(live); }
}
function done(){ $("run").disabled = false; $("run").textContent = L.run; renderAll(); loadHistory(); }

async function loadHistory(live){
  const box = $("history");
  let runs = [];
  try { runs = await (await fetch("/api/runs")).json(); } catch (e) {}
  if (!Array.isArray(runs)) runs = [];
  if (!live) { try { live = await (await fetch("/api/live")).json(); } catch (e) { live = []; } }
  if (!Array.isArray(live)) live = [];
  liveKey = live.map(r => r.id).join(",");
  box.replaceChildren();
  live.forEach(r => {
    const row = document.createElement("div"); row.className = "row live";
    row.innerHTML = '<span class="req" title="' + esc(r.request) + '">' + esc(r.request) + '</span><span class="cost">● ' +
      esc(L.working) + (r.source === "api" ? " · " + esc(L.fromApi) : "") + "</span>";
    const w = document.createElement("button"); w.className = "ghost"; w.textContent = L.watch; w.addEventListener("click", () => watch(r));
    row.append(w); box.append(row);
  });
  if (!runs.length && !live.length) { box.innerHTML = '<p class="empty">' + esc(L.noRuns) + "</p>"; return; }
  runs.forEach(r => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = '<span class="req" title="' + esc(r.request) + '">' + (r.example ? "<b>" + esc(L.example) + "</b> · " : "") +
      esc(r.request) + '</span><span class="cost">' + money(r.cost) +
      (r.saving_pct != null ? " · " + (r.saving_pct >= 0 ? L.saving + " " + r.saving_pct.toFixed(0) + "%" : L.costlier + " " + (-r.saving_pct).toFixed(0) + "%") : "") + "</span>";
    const rep = document.createElement("button"); rep.className = "ghost"; rep.textContent = L.replay; rep.addEventListener("click", () => replay(r.id, false));
    const op = document.createElement("button"); op.className = "ghost"; op.textContent = L.open; op.addEventListener("click", () => replay(r.id, true));
    const ex = document.createElement("a"); ex.className = "ghost"; ex.textContent = L.export; ex.href = "/api/export/" + encodeURIComponent(r.id);
    ex.style.textDecoration = "none";
    row.append(rep, op, ex); box.append(row);
  });
}

async function replay(id, instant){
  stopAll();
  const run = await (await fetch("/api/runs/" + encodeURIComponent(id))).json();
  if (!run || !run.events) return;
  S = fresh(); selected = "root"; $("req").value = run.request;
  const evs = run.events, speed = parseFloat($("speed").value) || 4;
  S.dry = (run.events || []).some(e => e.type === "llm_call" && e.cost_source === "simulated");
  const full = () => { if (typeof run.answer === "string" && run.answer) S.answer = run.answer; if (Array.isArray(run.warnings)) S.warnings = run.warnings.slice(); };
  if (instant) { evs.forEach(apply); full(); renderAll(); return; }
  let i = 0;
  const step = () => {
    if (i >= evs.length) { full(); renderAll(); return; }
    const ev = evs[i++]; apply(ev); schedule();
    const next = evs[i]; const wait = next ? Math.max(0, (next.t - ev.t) * 1000 / speed) : 0;
    replayTimer = setTimeout(step, Math.min(wait, 2500));
  };
  step();
}

async function init(){
  lang = pickLang(); applyLang();
  let r = null;
  try { r = await fetch("/api/info"); } catch (e) {}
  if (r && r.status === 401) { showLogin(); return; }
  try { info = r ? await r.json() : {}; } catch (e) { info = {}; }
  $("login").hidden = true;
  if (info.static) {  // the public demo: replay the saved run, nothing can be run from here
    document.body.classList.add("static"); $("static-note").hidden = false; $("req").readOnly = true;
    lang = pickLang(); applyLang();
    $("lang").addEventListener("change", e => { lang = e.target.value; try { localStorage.setItem("taskpenny.lang", lang); } catch(x) {} applyLang(); });
    $("copy").addEventListener("click", async () => { if (!S || !S.answer) return; try { await navigator.clipboard.writeText(S.answer); } catch (e) {} });
    replay(info.demo_id, false);
    return;
  }
  (info.profiles || ["all"]).forEach(p => { const o = document.createElement("option"); o.value = o.textContent = p; $("profile").append(o); });
  $("dry").checked = !!info.dry_run_default; $("dry").disabled = !info.has_key || !!info.force_dry;
  $("key-note").hidden = !!info.has_key;
  if (info.login) { $("logout").hidden = false; $("logout").onclick = async () => { try { await fetch("/api/logout", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"}); } catch (e) {} location.reload(); }; }
  lang = pickLang(); applyLang();
  $("lang").addEventListener("change", e => { lang = e.target.value; try { localStorage.setItem("taskpenny.lang", lang); } catch(x) {} applyLang(); });
  $("dry").addEventListener("change", () => { $("mode").textContent = $("dry").checked || !info.has_key ? L.dryMode : L.live; });
  $("run").addEventListener("click", run);
  $("req").addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run(); });
  setInterval(() => { if (!document.hidden) pollLive(); }, 4000);
  $("copy").addEventListener("click", async () => { if (!S || !S.answer) return; try { await navigator.clipboard.writeText(S.answer); $("copy").textContent = L.copied; setTimeout(() => $("copy").textContent = L.copy, 1500); } catch (e) {} });
}
function showLogin(){
  $("login").hidden = false; $("login-key").focus();
  $("login-form").onsubmit = async ev => {
    ev.preventDefault(); $("login-error").hidden = true;
    let ok = false;
    try { const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({key: $("login-key").value})}); ok = r.ok; } catch (e) {}
    if (ok) { $("login-key").value = ""; init(); } else { $("login-error").hidden = false; }
  };
}
init();
})();
