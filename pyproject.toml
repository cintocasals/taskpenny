[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
# Provisional distribution name: "siac" is already taken on PyPI. Final name before v1.0.
name = "siac-ai"
version = "0.2.0"
description = "Split a big prompt into small tasks and send each one to the cheapest model that can do it well. Decisions by Jev."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cinto Casals" }]
keywords = ["llm", "router", "cost", "agents", "task-decomposition", "jev", "claude", "gemini", "openai"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/cintocasals/siac"
Documentation = "https://github.com/cintocasals/siac/tree/main/docs"
Issues = "https://github.com/cintocasals/siac/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
siac = "siac.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/siac"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
