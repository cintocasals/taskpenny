[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "taskpenny"
version = "0.7.0"
description = "Sends each prompt, or each part of it when splitting pays, to the cheapest model that can do it well. Jev decides and checks every step."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cinto Casals" }]
keywords = ["llm", "router", "cost", "agents", "task-decomposition", "jev", "claude", "gemini", "openai"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/cintocasals/taskpenny"
Documentation = "https://github.com/cintocasals/taskpenny/tree/main/docs"
Issues = "https://github.com/cintocasals/taskpenny/issues"
Changelog = "https://github.com/cintocasals/taskpenny/blob/main/CHANGELOG.md"
Demo = "https://cintocasals.github.io/taskpenny/demo/"
Results = "https://github.com/cintocasals/taskpenny/blob/main/bench/public/RESULTS.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
taskpenny = "taskpenny.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taskpenny"]

# The source package holds the code, tests and docs to build and check it. The benchmark (with task texts under
# their own licences, see bench/public/README.md), the media and the demo page stay on GitHub.
[tool.hatch.build.targets.sdist]
include = ["/src/taskpenny", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/SECURITY.md",
           "/CONTRIBUTING.md", "/pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
